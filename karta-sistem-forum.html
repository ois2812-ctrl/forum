<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Карта систем ERP-форум</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column for a phone in hand; sticky step bar top, sticky action bar bottom; the client document is a white sheet */
:root{
  --magenta:#D2026D; --on-magenta:#fff; --teal:#1fae9e; --navy:#112434;
  --bg:#F4F6F7; --surface:#fff; --sunk:#eaeef1; --fg:#112434; --muted:#5b6b78; --line:#dde3e7;
  --chip-on:#112434; --chip-on-fg:#fff; --warn-bg:#fff4d6; --warn-fg:#6b4e00;
  --font:"Golos Text","Suisse Int'l",Arial,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1a26; --surface:#132a3b; --sunk:#0f2232; --fg:#e8eef2; --muted:#9db0bd; --line:#24425a;
  --chip-on:#25C6B3; --chip-on-fg:#0c1a26; --teal:#25C6B3; --magenta:#ff2f8f; --warn-bg:#3a3013; --warn-fg:#f5d98a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1a26; --surface:#132a3b; --sunk:#0f2232; --fg:#e8eef2; --muted:#9db0bd; --line:#24425a;
  --chip-on:#25C6B3; --chip-on-fg:#0c1a26; --teal:#25C6B3; --magenta:#ff2f8f; --warn-bg:#3a3013; --warn-fg:#f5d98a; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-block:0 130px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);margin-bottom:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand .logo{height:22px;width:auto;display:block}
.lg-light{display:none!important}
@media (prefers-color-scheme:dark){.lg-dark{display:none!important}.lg-light{display:block!important}}
.brand small{font-weight:400;color:var(--muted)}
.nav{display:flex;gap:6px}
.nav button{white-space:nowrap;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 11px;cursor:pointer}
.steps{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:4px;margin-top:10px}
.steps button{font:inherit;font-size:11.5px;line-height:1.2;color:var(--muted);background:none;border:none;border-top:4px solid var(--line);border-radius:0;padding:6px 2px 2px;cursor:pointer;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps button.on{border-top-color:var(--magenta);color:var(--fg)}
.steps button.cur{color:var(--magenta);font-weight:700}
.stepname{font-size:12px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.06em}
h1{font-size:24px;line-height:1.15;margin:0 0 6px;text-wrap:balance;letter-spacing:-.015em}
h2{font-size:15px;margin:20px 0 8px;font-weight:600}
.hint{color:var(--muted);font-size:14px;margin:0 0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 11px;cursor:pointer;text-align:left}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg);border-color:var(--chip-on)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tiles .chip{font-size:15px;padding:14px 12px;border-radius:12px;min-height:64px;line-height:1.25}
@media (max-width:360px){.tiles{grid-template-columns:1fr}}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);margin:14px 0 4px}
.consent input{width:20px;height:20px;flex-shrink:0;margin-top:1px}
.consent a{color:var(--magenta)}
.ct{border:1px solid var(--line);background:var(--surface);border-radius:12px;margin-top:8px}
.ct>button{font:inherit;width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:none;color:var(--fg);padding:12px 14px;cursor:pointer;text-align:left}
.ct>button b{font-weight:500}
.ct>button span{font-size:13px;color:var(--muted);text-align:right}
.ct>button span.st-new{color:var(--magenta);font-weight:600}
.ct>button span.st-keep{color:var(--teal);font-weight:600}
.ct .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.ct .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.sheet{background:#fff;border-radius:12px;border:1px solid var(--line);overflow-x:auto;margin-top:10px}
.sheet svg{display:block;width:100%;height:auto;min-width:520px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.btn{font:inherit;font-weight:600;font-size:16px;border-radius:12px;padding:13px 16px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--magenta);color:var(--on-magenta);border-color:var(--magenta);flex:1}
.btn.big{width:100%;justify-content:flex-start;padding:14px 16px;text-align:left}
.btn.big .n{width:26px;height:26px;border-radius:50%;background:var(--magenta);color:#fff;display:grid;place-items:center;font-size:14px;flex-shrink:0}
.btn.big small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.btn.sm{font-size:14px;padding:9px 12px;border-radius:10px;font-weight:500}
.btn[disabled]{opacity:.55}
.link{background:none;border:none;color:var(--magenta);font:inherit;font-size:14px;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.warn{background:var(--warn-bg);color:var(--warn-fg);border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
.mats label{display:flex;gap:10px;align-items:flex-start;font-size:15px;padding:6px 0}
.mats input{width:20px;height:20px;flex-shrink:0;margin-top:2px}
pre.msg{white-space:pre-wrap;word-break:break-word;font-family:var(--font);font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;max-height:260px;overflow:auto}
details{margin-top:8px}
details summary{cursor:pointer;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:#112434;color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;z-index:20;max-width:90vw}
.lead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.lead>div:first-child{min-width:0}
.lead b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead small{color:var(--muted)}
#qr{background:#fff;padding:12px;border-radius:12px;display:inline-block;margin-top:8px}
.imgout img{width:100%;border-radius:8px;border:1px solid var(--line);margin-top:8px}
#printArea{display:none}
@media print{@page{size:A4;margin:8mm}body{background:#fff;padding:0}body>*{display:none!important}#printArea{display:block!important}#printArea svg.pg{width:100%;height:auto;max-height:277mm;display:block;break-after:page;page-break-after:always}#printArea svg.pg:last-child{break-after:auto;page-break-after:auto}html,body{height:auto!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

const c2need=()=>toast(!L.consent?'Отметьте согласие на обработку данных':'Укажите почту или телефон');
const POLICY='https://www.1cbit.ru/privacy/';
function s4client(){
  L.src='client';
  const digits=ME.phone.replace(/\D/g,'').replace(/^8(\d{10})$/,'7$1');
  return `<h1>Получить схему</h1>
  <div class="stack">${inp('email','Email','email')}<div class="grid2">${inp('phone','Телефон','tel','+7')}${inp('tg','Telegram','text','@ник')}</div></div>
  <h2>Встретимся, чтобы посмотреть пример на ваших данных?</h2>${chips('when',[['date','Да, выберу время'],['later','Позже, свяжитесь со мной']])}
  ${L.when==='date'?`<div style="margin-top:10px">${chips('meet',MEETF,true)}</div><div class="grid2" style="margin-top:10px">${inp('date','Дата','date')}${inp('time','Время','time')}</div>`:''}
  <h2>Дальше</h2>
  <div class="stack">
    <button class="btn big" type="button" id="pdfBtn"><span class="n">1</span><span>Сохранить схему в PDF<small>Откроется печать, выберите «Сохранить как PDF»</small></span></button>
    <a class="btn big" id="mgrMail" href="mailto:${esc(ME.email)}?subject=${encodeURIComponent('Заявка с форума 1С:ERP'+(L.company?' — '+L.company:''))}&body=${encodeURIComponent(summaryText())}"><span class="n">2</span><span>Отправить менеджеру на почту<small>${esc(ME.email)}</small></span></a>
    <button class="btn big" type="button" id="tgSend"><span class="n">3</span><span>Или в Telegram<small>${ME.tgUser?'Текст скопируется, откроется чат с '+esc(ME.name)+', вставьте и отправьте':'Откроется Telegram, выберите чат с менеджером'}</small></span></button>
  </div>
  <details><summary>Текст для менеджера</summary><pre class="msg" id="sumPre">${esc(summaryText())}</pre><button class="btn sm" type="button" data-copy="sumPre">Скопировать</button></details>
  <p class="hint" style="margin-top:12px">Пока вы не отправите, данные остаются только в вашем браузере.</p>`;
}
function leadsHTML(){
  return `<h1>Лиды за форум</h1><p class="hint">Хранятся только на этом устройстве.</p>
  ${LEADS.length?`<div style="margin:8px 0"><button class="btn sm" type="button" id="copyAll">Скопировать все сводки</button></div>`:''}
  ${LEADS.slice().reverse().map(x=>`<div class="lead"><div><b>${esc(x.company||x.fio||'Без названия')}${x.example?' · пример':''}</b><small>${esc(x.fio)} · ${new Date(x.created).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</small></div>
   <div style="display:flex;gap:6px;flex-shrink:0"><button class="btn sm" type="button" data-openlead="${x.id}">Открыть</button><button class="btn sm" type="button" data-del="${x.id}" aria-label="Удалить">✕</button></div></div>`).join('')}
  <pre class="msg" id="allPre" hidden></pre>`;
}
function setHTML(){
  return `<h1>Настройки</h1><p class="hint">Подпись в письме и PDF. Каждый коллега заполняет своё на своём устройстве.</p>
  <div class="stack" style="margin-top:10px">${[['name','Имя и фамилия'],['pos','Должность'],['phone','Телефон (сюда клиенты пишут в WhatsApp)'],['email','Email'],['tgUser','Telegram-ник, необязательно'],['link','Ссылка на эту страницу (если пусто, берётся текущая)'],['policy','Ссылка на политику обработки ПДн (для клиентской формы)']].map(([k,l])=>`<label class="f">${l}<input id="me_${k}" data-me="${k}" value="${esc(ME[k])}"></label>`).join('')}</div>
  <h2>QR для клиентов</h2><p class="hint">Какую форму открывает QR.</p><div class="chips" style="margin-bottom:8px"><button type="button" class="chip" data-qr="c" aria-pressed="${(ME.qr||'c')==='c'}">Новая, 3 шага (тест)</button><button type="button" class="chip" data-qr="client" aria-pressed="${ME.qr==='client'}">Старая, 5 шагов</button></div>
  <div id="qr"></div><p class="hint" id="qrUrl"></p>`;
}
function render(keep){
  derive();
  const y=window.scrollY, f=view==='form', S=STEPS();
  $('#nav').innerHTML=CLIENT()?'':`<button id="navNew" type="button">Новый</button><button id="navLeads" type="button">Лиды${LEADS.length?' ('+LEADS.length+')':''}</button><button id="navSet" type="button" aria-label="Настройки">⚙</button>`;
  $('#stepsBar').style.setProperty('--n',S.length);
  $('#stepsBar').innerHTML=f?S.map((n,i)=>`<button type="button" data-step="${i}" class="${i<=step?'on':''} ${i===step?'cur':''}" ${i===step?'aria-current="step"':''}>${esc(n)}</button>`).join(''):'';
  $('#stepName').textContent='';
  const FN=CLIENT2()?[cA,c0,c1,c2]:CLIENT()?[s0,s1,s2,s3,s4]:[s0,s2,s1,s3,s4],last=FN.length-1;if(step>last)step=last;
  $('#app').innerHTML=view==='leads'?leadsHTML():view==='set'?setHTML():FN[step]();
  const nl=CLIENT2()?['Дальше','Дальше','Дальше'][step]:['Дальше','Дальше','Показать',CLIENT()?'Получить схему':'К отправке'][step];
  $('#barIn').innerHTML=!f?`<button class="btn primary" type="button" id="toForm">К анкете</button>`
    :step<last?`${step?'<button class="btn" type="button" id="prev">Назад</button>':''}<button class="btn primary" type="button" id="next">${nl}</button>`
    :`<button class="btn" type="button" id="prev">Назад</button>${CLIENT()?'':'<button class="btn primary" type="button" id="newLead">Следующий</button>'}`;
  if(view==='set')drawQR();
  window.scrollTo(0,keep?y:0);
}
function drawQR(){const el=$('#qr');if(!el)return;const base=ME.link||(/^https?:/.test(location.href)?location.href:'');const url=base.split('#')[0]+'#'+(ME.qr||'c');if(!base){el.textContent='Укажи ссылку, по которой открыт этот файл';$('#qrUrl').textContent='';return}$('#qrUrl').textContent=url;el.innerHTML='';try{new QRCode(el,{text:url,width:200,height:200})}catch(e){el.textContent='QR не загрузился'}}
function save(){store.set('fm_draft',{L,step})}
const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))));
function leadLink(){const o={};['company','fio','pos','email','phone','tg','pain','scn','sv','sva','cc','ents','grp','when','industry','size'].forEach(k=>{const v=L[k];if(v&&(!Array.isArray(v)||v.length)&&(typeof v!=='object'||Array.isArray(v)||Object.keys(v).length))o[k]=v});
  const ot={};Object.keys(L.sys).forEach(id=>{if(otherOf(id))ot[id]=otherOf(id)});if(Object.keys(ot).length)o.other=ot;
  return (ME.link||location.href).split('#')[0].split('?')[0]+'#lead='+b64e(JSON.stringify(o))}
function importLead(h){try{const o=JSON.parse(b64d(h));L=norm(Object.assign(blank(),o,{src:'client'}));Object.entries(o.other||{}).forEach(([id,n])=>{L.sys[id]=L.sys[id]||{};L.sys[id].other=n});derive(true);saveLead();step=0;view='form';open='';save();
  history.replaceState(null,'',location.pathname+location.search);setTimeout(()=>toast('Лид клиента загружен, дополни'),300)}catch(e){toast('Ссылка повреждена')}}
function saveLead(){if(CLIENT())return;const i=LEADS.findIndex(x=>x.id===L.id),c=JSON.parse(JSON.stringify(L));i>=0?LEADS[i]=c:LEADS.push(c);store.set('fm_leads',LEADS)}
function copy(el){const t=el.textContent,fb=()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Текст выделен, скопируй вручную')};try{navigator.clipboard.writeText(t).then(()=>toast('Скопировано'),fb)}catch(e){fb()}}
function refreshLinks(){ // ссылки отправки зависят от полей — обновляем без перерисовки
  const m=$('#mailBtn');if(m)m.href=mailHref();
  const e=$('#emailPre');if(e)e.textContent='Тема: '+emailSubject()+'\n\n'+emailText();
  const s=$('#sumPre');if(s)s.textContent=summaryText();
  document.querySelectorAll('a[href^="https://t.me/share"]').forEach(a=>a.href='https://t.me/share/url?url='+encodeURIComponent(summaryText()));
  const mm=$('#mgrMail');if(mm)mm.href=mgrHref();
}

document.addEventListener('click',e=>{
  if(CLIENT2()&&e.target.closest('#mgrMail,#tgSend')&&!c2ok()){e.preventDefault();c2need();return}
  if(CLIENT2()&&e.target.closest('#mgrMail'))setTimeout(()=>toast('Не забудьте нажать «Отправить» в почте'),600);
  const c=e.target.closest('[data-p]');
  if(c){const p=c.dataset.p,v=c.dataset.v;
    if(c.dataset.m==='1'){let a=arr(getP(p)).slice();const i=a.indexOf(v);if(i>=0)a.splice(i,1);else{a.push(v);
        if(/^cc\./.test(p)){if(v==='Нет системы'||v==='Не знаю')a=[v];else a=a.filter(x=>x!=='Нет системы'&&x!=='Не знаю')}
        if(/^sv\./.test(p)){if(v==='adv')a=['adv'];else a=a.filter(x=>x!=='adv')}
        if(/\.st$/.test(p)){if(v==='q')a=['q'];else{a=a.filter(x=>x!=='q');if(v==='replace'||v==='none')a=a.filter(x=>!['keep','add','replace','none'].includes(x)||x===v);if(v==='keep'||v==='add')a=a.filter(x=>x!=='replace'&&x!=='none');if(v==='add')a=a.filter(x=>x!=='keep')}}}
      setP(p,a)}
    else setP(p,getP(p)===v?'':v);
    {const mm=p.match(/^sys\.(\w+)\.(st|tgt)$/);if(mm){L.sys[mm[1]].manual=true}}
    if(p==='focus')L.proc=[];if(p==='role')L.out=[];if(p==='scn'){L.focus=[];L.proc=[]}
    save();saveLead();render(true);return}
  const ig=e.target.closest('[data-integ]');
  if(ig){const G=graph(),x=ig.dataset.integ,v=ig.dataset.v;L.integ=L.integ||{};const tg=G.targets.find(o=>o.name===x),d=tg?G.defaults(tg):[],ov=L.integ[x]=Object.assign({add:[],del:[]},L.integ[x]);ov.add=arr(ov.add);ov.del=arr(ov.del);
    if((G.partners[x]||[]).includes(v)){ov.add=ov.add.filter(n=>n!==v);if(d.includes(v)&&!ov.del.includes(v))ov.del.push(v);
      const t2=G.targets.find(o=>o.name===v);if(t2&&(G.partners[v]||[]).includes(x)){const o2=L.integ[v]=Object.assign({add:[],del:[]},L.integ[v]);o2.add=arr(o2.add).filter(n=>n!==x);o2.del=arr(o2.del);if(G.defaults(t2).includes(x)&&!o2.del.includes(x))o2.del.push(x)}}else{ov.del=ov.del.filter(n=>n!==v);if(!d.includes(v))ov.add.push(v)}
    save();saveLead();render(true);return}
  const o=e.target.closest('[data-open]');if(o){open=open===o.dataset.open?'':o.dataset.open;render(true);return}
  const b=e.target.closest('button');if(!b)return;const id=b.id;
  if(b.dataset.qr){ME.qr=b.dataset.qr;store.set('fm_me',ME);render(true);return}
  if(b.dataset.need){toast(L.consent?'Укажите почту или телефон':'Отметьте согласие на обработку данных');return}
  if(id==='addP'){L.more=arr(L.more);L.more.push({fio:'',pos:'',email:'',phone:'',tg:''});save();render(true);const f=document.getElementById('i_more_'+(L.more.length-1)+'_fio');if(f)f.focus();return}
  if(b.dataset.delp!=null){L.more.splice(+b.dataset.delp,1);save();saveLead();render(true);return}
  if(b.dataset.step!=null){step=+b.dataset.step;open='';save();render();return}
  if(id==='next'){if(CLIENT2()){if(step===0&&!L.company.trim()){toast('Укажите компанию');return}if(step===1&&!arr(L.scn).length&&!L.pain.trim()){toast('Выберите хотя бы одну задачу');return}}else if(step===0&&!L.company.trim()&&!L.fio.trim()){toast('Впиши хотя бы компанию');return}step++;open='';save();render()}
  else if(id==='prev'){step--;render()}
  else if(id==='navNew'||id==='newLead'){L=blank();step=0;view='form';open='';save();render()}
  else if(id==='navLeads'){view='leads';render()}
  else if(id==='navSet'){view='set';render()}
  else if(id==='toForm'){view='form';render()}
  else if(id==='pdfBtn'){printSheet()}
  else if(id==='tgSend'){const t=CLIENT2()?clientMsg():summaryText(),u=(ME.tgUser||'').replace(/^@/,'').trim();
    if(u){try{navigator.clipboard.writeText(t).then(()=>toast('Текст скопирован, вставьте его в чат'),()=>{})}catch(e){}setTimeout(()=>{location.href='https://t.me/'+u},400)}
    else location.href='https://t.me/share/url?url='+encodeURIComponent(t)}
  else if(b.dataset.copy)copy($('#'+b.dataset.copy));
  else if(id==='copyAll'){const pre=$('#allPre'),cur=L;pre.textContent=LEADS.filter(x=>!x.example).map(x=>{L=norm(Object.assign(blank(),x));return summaryText()}).join('\n\n———\n\n')||'Пока только примеры.';L=cur;pre.hidden=false;copy(pre)}
  else if(b.dataset.openlead){L=norm(Object.assign(blank(),JSON.parse(JSON.stringify(LEADS.find(x=>String(x.id)===b.dataset.openlead)))));view='form';step=3;render()}
  else if(b.dataset.del){if(b.dataset.sure){LEADS=LEADS.filter(x=>String(x.id)!==b.dataset.del);store.set('fm_leads',LEADS);render(true)}else{b.dataset.sure='1';b.textContent='Удалить?'}}
  else if(id==='fillEx'){L=Object.assign(blank(),{example:true,company:'Пример: завод упаковки',industry:['Производство'],size:'500–1 000',role:['Финансы','ИТ'],fio:'Петрова Анна Сергеевна',pos:'Финансовый директор',
    sys:{acc:{cur:['1С:УПП'],st:'replace',tgt:['1С:ERP']},prod:{cur:['1С:УПП'],st:'replace',tgt:['1С:ERP']},fin:{cur:['Excel'],st:'replace',tgt:['Бит.Финанс']},sales:{cur:['Битрикс24'],st:'keep'},hr:{cur:['1С:ЗУП'],st:'add',tgt:['1С:Кадровый ЭДО']},rpa:{cur:['Вручную'],st:'none',tgt:['ИИ-распознавание документов']},bi:{cur:['Excel','Power BI'],st:'q'},wh:{cur:['1С:УТ'],st:'keep'}},
    ext:['Банк','ЭДО','Честный знак'],focus:['acc','fin'],pain:'Себестоимость считаем раз в месяц в Excel, УПП уже не тянет, бюджеты собираем две недели',
    trigger:['Конец поддержки системы','Бюджет на 2027'],timing:'3–6 месяцев',budget:'Будут закладывать',when:'date',meet:['Онлайн'],date:'2026-12-03',time:'11:00',email:'example@example.com'});step=3;save();render()}
});
document.addEventListener('change',e=>{
  const m=e.target.dataset.mat;if(m!=null){const i=L.matsOff.indexOf(m);e.target.checked?(i>=0&&L.matsOff.splice(i,1)):L.matsOff.push(m);save();render(true)}
  if(e.target.id==='consent'){L.consent=e.target.checked;render(true);return}
  if(e.target.dataset.i&&step===3&&!CLIENT2())render(true);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.i){setP(t.dataset.i,t.value);save();saveLead();refreshLinks()}
  if(t.dataset.me){ME[t.dataset.me]=t.value;store.set('fm_me',ME);if(t.dataset.me==='link')drawQR()}
});
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#lead=')){importLead(location.hash.slice(6));render();return}L=blank();step=0;view='form';render()});
const dr=store.get('fm_draft',null);
if(!CLIENT()&&dr&&dr.L&&dr.L.id){L=norm(Object.assign(blank(),dr.L));step=dr.step||0}
if(location.hash.startsWith('#lead='))importLead(location.hash.slice(6));
render();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
